[project]
name = "omnitherm-api"
version = "0.1.0"
description = "OmniTherm AI Backend - Thermal Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "slowapi>=0.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.6",
    "google-adk>=1.0",
    "google-generativeai>=0.8",
    "langchain-chroma>=0.1",
    "langchain-huggingface>=0.1",
    "langchain-google-genai>=2.0",
    "pypdf>=4.0",
    "uuid6>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "T20", "PT", "PTH", "ERA", "PL", "TRY", "NPY", "FA", "SIM", "TID", "ARG", "FLY", "PD", "PGH", "PIE", "RET", "SLF", "SLOT", "TRY", "NPY", "RSE", "TRY003", "TRY002", "TRY004", "TCH"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ANN401", "ARG001", "ARG002", "TRY003"]
fixable = ["F", "I", "UP", "B", "C4", "PTH", "PL", "T20", "ERA", "PT", "SIM", "TID", "NPY", "RSE", "TRY003", "TRY002", "TRY004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]